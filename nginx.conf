server {
    listen       80;
    server_name  localhost;

    # 前端静态文件根目录
    root   /usr/share/nginx/html;

    # 所有 HTML 请求都返回 index.html（解决 Vue Router 的 404 问题）
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 请求反向代理到云托管后端
    # 后端 Spring Boot 设置了 server.servlet.context-path: /api
    # 所以前端相对路径 /api/xxx 会被转发为 后端域名/api/xxx
    location ^~ /api/ {
        # 云托管后端地址（来源于用户的云托管服务域名）
        proxy_pass https://da-ai-agenta-249544-6-1407965041.sh.run.tcloudbase.com/api/;

        # 请求头：Host 必须是后端域名本身，不能带 http(s) 前缀
        proxy_set_header Host da-ai-agenta-249544-6-1407965041.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（Server-Sent Events）配置：关闭缓冲与缓存，保持长连接
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;

        # 增加错误调试信息
        proxy_intercept_errors off;
    }

    # 处理静态资源请求：长缓存 + 不记录访问日志
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # 错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
